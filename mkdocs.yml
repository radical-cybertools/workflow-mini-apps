site_name: RADICAL Workflow Mini-Apps
repo_url: https://github.com/radical-cybertools/workflow-mini-apps
docs_dir: docs
strict: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Kernels: kernels.md
  - API:
      - MiniApp: api/miniapp.md
      - Kernels: api/kernels.md
  - Design:
      - Telemetry-first MiniApp API: design/miniapp-telemetry.md
  - Testing:
      - Equivalence harness: testing/equivalence.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true

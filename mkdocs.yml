site_name: RADICAL Workflow Mini-Apps
site_url: https://radical-cybertools.github.io/workflow-mini-apps/
site_author: RADICAL Cybertools
site_description: Build workflow mini-apps from emulation kernels, and record and verify every run with MiniApp.

repo_name: radical-cybertools/workflow-mini-apps
repo_url: https://github.com/radical-cybertools/workflow-mini-apps
docs_dir: docs
strict: true

copyright: Copyright &copy; 2024—Present by <a target="_blank" href="https://radical.rutgers.edu">RADICAL Lab</a>

# Same theme and features as the RHAPSODY docs; own warm beige palette (docs/stylesheets/extra.css)
theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.path
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate      # the page's contents in the left sidebar
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radical-cybertools/workflow-mini-apps

extra_css:
  - stylesheets/extra.css

watch:
  - mkdocs.yml
  - docs/
  - src/

# Page paths are kept from earlier releases (the site is live); only the grouping changes.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Build a mini-app:
      - Write the workflow: building.md
      - Kernels: kernels.md
      - Examples: examples.md
      - Run on HPC: hpc.md
  - MiniApp:
      - Use MiniApp: api/miniapp.md
      - Runs of many engines: runs.md
      - Telemetry: telemetry.md
      - Troubleshooting: troubleshooting.md
  - API reference:
      - MiniApp: api/reference.md
      - Kernels: api/kernels.md
  - For developers:
      - Equivalence harness: testing/equivalence.md
      - Validation on an HPC node: testing/hpc-validation.md
  - Changelog: https://github.com/radical-cybertools/workflow-mini-apps/blob/main/CHANGELOG.md

# --strict alone does not fail on broken anchors (MkDocs 1.6 reports them at info level)
validation:
  links:
    anchors: warn
    unrecognized_links: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:        # mermaid diagrams; Material loads mermaid itself
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

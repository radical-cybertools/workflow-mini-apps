# Tiny inputs for the equivalence harness: same keys as examples/motif_2/config.yaml.
stages:
  - name: "coarse_screening"
    ensemble_size: 8
    steps: 2
    read_size_bytes: 1024
    write_size_bytes: 4096
    device: "cpu"
    matmul_dim: 16
    filter_threshold: 0.5
  - name: "refinement"
    ensemble_size: 4
    steps: 2
    read_size_bytes: 1024
    write_size_bytes: 4096
    device: "cpu"
    matmul_dim: 16
    filter_threshold: 0.5
  - name: "high_fidelity"
    ensemble_size: 2
    steps: 2
    read_size_bytes: 1024
    write_size_bytes: 4096
    device: "cpu"
    matmul_dim: 16
    filter_threshold: 0.5
analysis:
  steps: 2
  read_size_bytes: 1024
  write_size_bytes: 512
  data_copy_size_bytes: 256
  matmul_dim: 16

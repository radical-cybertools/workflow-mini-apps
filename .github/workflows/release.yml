name: Release

# Builds wfMiniAPI's wheel and sdist. On a pull request that touches the packaging, it only
# builds them. On a pushed tag `vX.Y.Z`, it checks that the tag matches the version in
# pyproject.toml and attaches both files to the GitHub release of that tag, creating the release
# from the changelog's section for X.Y.Z if it doesn't exist yet. The files can then be
# installed from the release's URL, e.g.
#   https://github.com/radical-cybertools/workflow-mini-apps/releases/download/v0.3.0/wfminiapi-0.3.0-py3-none-any.whl

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - src/wfMiniAPI/__init__.py
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel and the sdist
        run: |
          python -m pip install build
          python -m build
          ls -l dist

      - name: Check that the package's versions agree
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python -m pip install dist/*.whl
          installed=$(cd /tmp && python -c "import wfMiniAPI; print(wfMiniAPI.__version__)")
          if [ "$installed" != "$version" ]; then
            echo "pyproject.toml says $version, wfMiniAPI.__version__ says $installed"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME, but pyproject.toml says $version"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach them to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v v="${TAG#v}" 'index($0, "## " v " ") == 1 {f = 1; next} /^## / && f {exit} f' \
              CHANGELOG.md > notes.md
            gh release create "$TAG" --verify-tag --title "wfMiniAPI ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
